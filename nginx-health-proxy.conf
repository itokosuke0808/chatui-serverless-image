server {
    listen 11434;

    location /ping {
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        proxy_pass http://127.0.0.1:11435;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
